# === Ansible Settings =================================================================================================

# Specifies the Python interpreter to be used on the remote nodes.
ansible_python_interpreter: /usr/bin/python

# SSH key pair used to reach the cluster nodes. It has to live under /data, the only host
# folder mounted into the ansible container. The public key is expected next to it, as <ssh_key_file>.pub
ssh_key_file: /data/ansible/id_ed25519

# Connection to cluster nodes
ansible_user: root
ansible_private_key_file: "{{ ssh_key_file }}"
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

# === Restore archive parameter ========================================================================================

# Path to the restore archive (to be provided via CLI parameters). Should be an absolute file path.
restore_archive: ""

# === Cluster ID =======================================================================================================
cluster_id: "AkU3OEVBNTcwNTJENDM2Qd"