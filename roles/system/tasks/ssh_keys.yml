---
- name: Check that the SSH key pair is reachable from the ansible container
  tags: ssh_keys
  ansible.builtin.stat:
    path: "{{ item }}"
  register: ssh_key_pair
  loop:
    - "{{ ssh_key_file }}"
    - "{{ ssh_key_file }}.pub"
  delegate_to: localhost
  run_once: true

- name: Fail early when the SSH key pair is missing
  tags: ssh_keys
  ansible.builtin.fail:
    msg: |
      SSH key pair not found: {{ ssh_key_pair.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
      Only /data is mounted into the ansible container, so the pair has to live there. Either copy an
      existing one, or create a new one on the host:
        ssh-keygen -t ed25519 -N '' -f {{ ssh_key_file }}
  when: ssh_key_pair.results | rejectattr('stat.exists') | list | length > 0
  run_once: true

- name: Add host to known_hosts
  tags: ssh_keys
  ansible.builtin.known_hosts:
    path: ~/.ssh/known_hosts
    name: "{{ ansible_host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -q ' + ansible_host) }}"
    state: present
  delegate_to: localhost

- name: Ensure SSH directory exists on the remote host
  tags: ssh_keys
  ansible.builtin.file:
    path: ~/.ssh
    state: directory
    mode: '0700'

- name: Copy public key to the remote server
  tags: ssh_keys
  ansible.builtin.lineinfile:
    path: ~/.ssh/authorized_keys
    line: "{{ lookup('file', ssh_key_file + '.pub') }}"
    create: true
    mode: '0600'

- name: Test password-less SSH access
  tags: ssh_keys
  ansible.builtin.command:
    cmd: >-
      ssh -i {{ ssh_key_file }}
      -o IdentitiesOnly=yes
      -o BatchMode=yes
      -o StrictHostKeyChecking=no
      {{ ansible_user }}@{{ ansible_host }} "hostname && uname -a"
  delegate_to: localhost
  changed_when: false
  register: ssh_test_output

- name: Display SSH test output
  tags: ssh_keys_off
  ansible.builtin.debug:
    msg: |
      Host: {{ ansible_host }}
      stdout: {{ ssh_test_output.stdout }}
      stderr: {{ ssh_test_output.stderr }}
